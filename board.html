<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Points — Board</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="board-view">

<div class="board-header">
  <h1 id="class-name">Class Points</h1>
  <p class="sub" id="board-status">Waiting for teacher console…</p>
</div>

<div class="board-list" id="board-list"></div>

<script type="module">
  const medals = ['🥇', '🥈', '🥉'];
  const channel = new BroadcastChannel('class-points-board');

  channel.addEventListener('message', e => {
    if (e.data.type === 'leaderboard-update') {
      document.getElementById('class-name').textContent = e.data.className || 'Class Points';
      document.getElementById('board-status').textContent = '● Live';
      render(e.data.leaderboard);
    }
  });

  // Ask teacher console for current snapshot on load
  channel.postMessage({ type: 'request-snapshot' });

  function render(leaderboard) {
    const list = document.getElementById('board-list');

    leaderboard.forEach((entry, i) => {
      const rank = i + 1;
      const id = String(entry.id);
      const existing = list.querySelector(`[data-id="${id}"]`);
      const prevTotal = existing ? parseInt(existing.dataset.total) : null;
      const changed = prevTotal !== null && prevTotal !== entry.total;

      if (existing) {
        existing.dataset.total = entry.total;
        existing.className = `board-row rank-${rank}`;
        existing.querySelector('.board-pts').innerHTML =
          `${entry.total}<span class="board-pts-unit"> pts</span>`;
        if (changed) {
          existing.classList.remove('pulse');
          void existing.offsetWidth;
          existing.classList.add('pulse');
        }
      } else {
        const row = document.createElement('div');
        row.className = `board-row rank-${rank}`;
        row.dataset.id = id;
        row.dataset.total = entry.total;
        row.innerHTML = `
          ${rank <= 3
            ? `<span class="board-medal">${medals[i]}</span>`
            : `<span class="board-rank-num">${rank}</span>`}
          <span class="board-name">${esc(entry.display_name)}</span>
          <span class="board-pts">${entry.total}<span class="board-pts-unit"> pts</span></span>
        `;
        list.appendChild(row);
      }
    });

    // Remove rows that no longer exist
    list.querySelectorAll('[data-id]').forEach(row => {
      if (!leaderboard.find(e => String(e.id) === row.dataset.id)) row.remove();
    });

    // Re-sort DOM rows to match leaderboard order
    leaderboard.forEach(entry => {
      const row = list.querySelector(`[data-id="${String(entry.id)}"]`);
      if (row) list.appendChild(row);
    });
  }

  function esc(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
